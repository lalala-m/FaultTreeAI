version: '3.8'

services:
  # PostgreSQL 数据库 + pgvector
  db:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: faulttree-db
    environment:
      POSTGRES_DB: faulttree
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-faulttree123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    dns:
      - 8.8.8.8
      - 114.114.114.114
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faulttree-backend
    environment:
      PYTHONPATH: /app:/app/backend
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-faulttree123}@db:5432/faulttree
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-faulttree123}
      DB_USER: postgres
      DB_NAME: faulttree
      LLM_PROVIDER: openai
      LLM_FALLBACK_PROVIDER: openai
      EMBED_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://qianfan.baidubce.com/v2}
      LLM_MODEL: ${LLM_MODEL:-glm-5.1}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-ada-002}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 114.114.114.114
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/manuals:/app/data/manuals
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faulttree-frontend
    ports:
      - "5173:80"
      - "8443:443"
    depends_on:
      - backend
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
